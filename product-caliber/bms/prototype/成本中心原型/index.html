<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMS 成本中心原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">BMS</div>
        <span>测试供应链</span>
        <button class="icon-btn topbar-icon" data-action="switch-org" title="切换组织"><i data-lucide="chevron-down"></i></button>
      </div>
      <nav class="top-menu" aria-label="顶部菜单">
        <button>首页</button><button>基础信息</button><button>费用中心</button><button>工单系统</button><button>数据中心</button><button>仓库系统</button><button>客户管理</button><button>店铺</button>
      </nav>
      <div class="top-actions">
        <button class="icon-btn topbar-icon" data-action="open-data-tools" title="模拟数据管理"><i data-lucide="database-backup"></i></button>
        <button class="icon-btn topbar-icon" title="应用"><i data-lucide="layout-grid"></i></button>
        <button class="icon-btn topbar-icon" title="消息"><i data-lucide="message-square"></i><span class="notification-dot"></span></button>
        <span class="avatar">财</span><span class="user-name">财务管理员</span>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="side-title">账单系统</div>
      <nav class="side-nav">
        <button class="nav-item active" data-view="overview"><i data-lucide="layout-dashboard"></i><span>成本总览</span></button>
        <div class="nav-group-label">成本管理</div>
        <button class="nav-item" data-view="suppliers"><i data-lucide="building-2"></i><span>供应商管理</span></button>
        <button class="nav-item" data-view="bills"><i data-lucide="file-spreadsheet"></i><span>成本账单</span><span class="nav-count">8</span></button>
        <button class="nav-item" data-view="pool"><i data-lucide="database"></i><span>成本池</span><span class="nav-count warn">23</span></button>
        <button class="nav-item" data-view="allocation"><i data-lucide="split"></i><span>间接成本分摊</span><span class="nav-count warn">6</span></button>
        <div class="nav-group-label">分析与配置</div>
        <button class="nav-item" data-view="profit"><i data-lucide="chart-no-axes-combined"></i><span>利润分析</span></button>
        <button class="nav-item" data-view="fees"><i data-lucide="tags"></i><span>成本费项索引</span></button>
      </nav>
      <div class="sidebar-foot"><i data-lucide="circle-help"></i><span>成本中心操作指引</span></div>
    </aside>

    <main class="workspace">
      <div class="route-tabs">
        <button class="sidebar-toggle icon-btn" data-action="toggle-sidebar" title="展开或收起菜单"><i data-lucide="panel-left"></i></button>
        <span>首页</span><i data-lucide="chevron-right"></i><span class="current-route">成本总览</span>
      </div>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="drawer-backdrop" class="backdrop hidden"></div>
  <aside id="drawer" class="drawer hidden" aria-modal="true"></aside>
  <div id="modal-backdrop" class="modal-backdrop hidden"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
  <input id="prototype-data-file" type="file" accept="application/json,.json" hidden>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
