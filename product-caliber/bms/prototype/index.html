<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMS 账单与成本中心原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">BMS</div>
        <span>测试供应链</span>
        <button class="icon-btn topbar-icon" data-action="switch-org" title="切换组织"><i data-lucide="chevron-down"></i></button>
      </div>
      <nav class="top-menu" aria-label="顶部菜单">
        <button class="active" data-domain="billing"><i data-lucide="receipt-text"></i><span>账单系统</span></button>
        <button data-domain="cost"><i data-lucide="chart-no-axes-combined"></i><span>成本中心</span></button>
      </nav>
      <div class="top-actions">
        <button class="icon-btn topbar-icon" data-view="suppliers" title="供应商管理"><i data-lucide="building-2"></i></button>
        <button class="icon-btn topbar-icon" data-action="open-data-tools" title="模拟数据管理"><i data-lucide="database-backup"></i></button>
        <button class="icon-btn topbar-icon" title="应用"><i data-lucide="layout-grid"></i></button>
        <button class="icon-btn topbar-icon" title="消息"><i data-lucide="message-square"></i><span class="notification-dot"></span></button>
        <span class="avatar">财</span><span class="user-name">财务管理员</span>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="side-title">账单系统</div>
      <nav class="side-nav">
        <div class="nav-group-label">财务日常</div>
        <button class="nav-item" data-billing-view="receivable"><i data-lucide="file-text"></i><span>应收账单</span></button>
        <button class="nav-item" data-billing-view="refund"><i data-lucide="receipt"></i><span>返款账单</span></button>
        <button class="nav-item" data-billing-view="remittance"><i data-lucide="banknote"></i><span>回款管理</span></button>
        <button class="nav-item" data-billing-view="adjustments"><i data-lucide="sliders-horizontal"></i><span>调账中心</span></button>
        <div class="nav-group-label">核心配置</div>
        <button class="nav-item" data-billing-view="config"><i data-lucide="settings"></i><span>账单配置</span></button>
        <button class="nav-item" data-billing-view="rates"><i data-lucide="coins"></i><span>汇率配置</span></button>
        <div class="nav-group-label">过程管控</div>
        <button class="nav-item active" data-billing-view="tasks"><i data-lucide="clipboard-list"></i><span>生成任务</span><span class="nav-count warn">4</span></button>
        <button class="nav-item" data-billing-view="exports"><i data-lucide="download"></i><span>导出管理</span></button>
        <button class="nav-item" data-billing-view="audit"><i data-lucide="shield-check"></i><span>内部审计</span></button>
        <div class="nav-group-label">辅助测试</div>
        <button class="nav-item" data-billing-view="compare"><i data-lucide="search-check"></i><span>报表比对</span></button>
        <button class="nav-item" data-billing-view="migration"><i data-lucide="refresh-cw"></i><span>数据迁移</span></button>
      </nav>
      <div class="sidebar-foot"><i data-lucide="circle-help"></i><span>账单系统操作指引</span></div>
    </aside>

    <main class="workspace">
      <div class="route-tabs">
        <button class="sidebar-toggle icon-btn" data-action="toggle-sidebar" title="展开或收起菜单"><i data-lucide="panel-left"></i></button>
        <button id="route-back" class="route-back hidden" data-action="back-bills" title="返回成本账单列表"><i data-lucide="arrow-left"></i><span>返回</span></button>
        <span>首页</span><i data-lucide="chevron-right"></i><span class="current-route">生成任务</span>
      </div>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="drawer-backdrop" class="backdrop hidden"></div>
  <aside id="drawer" class="drawer hidden" aria-modal="true"></aside>
  <div id="modal-backdrop" class="modal-backdrop hidden"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
  <input id="prototype-data-file" type="file" accept="application/json,.json" hidden>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
